<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glyph review · SlitherEscape Studio</title>
<style>
  body { margin: 0; padding: 24px; background: #F5EFE3; color: #3B2412; font: 14px system-ui, sans-serif; }
  h1 { font: 26px Georgia, serif; margin: 0 0 4px; }
  p { color: #8E7A64; margin: 0 0 18px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 12px; }
  .card h2 small { font: 12px system-ui, sans-serif; color: #8E7A64; margin-left: 6px; }
  .card { background: #FFFCF6; border: 1px solid #E4D6BD; border-radius: 10px; padding: 10px; }
  .card h2 { font: 20px Georgia, serif; margin: 0 0 6px; }
  .row { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
  .row figure { margin: 0; text-align: center; font-size: 11px; color: #8E7A64; }
</style>
</head>
<body>
<h1>Glyph review</h1>
<p>Every letter with all its variants (hover for the name). Shaded cells are what players colour in. All pass the connectivity, no-hole and no-pinch checks.</p>
<div class="grid" id="grid"></div>
<script src="../assets/js/engine/glyphs.js"></script>
<script>
  const S = 7;
  document.getElementById('grid').innerHTML = Object.keys(Glyphs.LIBRARY).map((L) => {
    const figs = Glyphs.variants(L).map((g) => {
      const rects = [];
      for (let r = 0; r < g.h; r++) for (let c = 0; c < g.w; c++) {
        if (g.cells[r * g.w + c]) rects.push(`<rect x="${c * S}" y="${r * S}" width="${S}" height="${S}" fill="#7A5230"/>`);
      }
      return `<figure title="${g.name} · ${g.w}x${g.h}"><svg width="${g.w * S}" height="${g.h * S}" style="background:#EEDDBA">${rects.join('')}</svg></figure>`;
    }).join('');
    return `<div class="card"><h2>${L}<small>${Glyphs.variants(L).length} variants</small></h2><div class="row">${figs}</div></div>`;
  }).join('');
</script>
</body>
</html>
